# Copy to napig.yaml, or set NAPIG_CONFIG to its absolute path.
webui:
  public-url: https://napcat.example.com
  # enabled: false  # A headless instance does not need public-url.
  # host: "::"
  # port: 6099

account:
  id: "123456789"
  # password: "optional QQ password"

onebot:
  network:
    websocketClients:
      - name: service
        enable: true
        url: ws://consumer:3001
        token: "replace-with-your-onebot-token"

